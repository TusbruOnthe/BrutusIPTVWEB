<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>BrutusIPTV</title>
<meta name="theme-color" content="#0b0b0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BrutusIPTV">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* Palette bleu / violet identique à la version PC */
:root{
  --bg:#0b0b0e;--panel:#141317;--card2:#1c1b22;--hover:#1d1c23;--selrow:#f2f2f4;--seltext:#111114;
  --chip:#2b2a32;--entry:#1b1a20;--line:#27262d;--tile:#202027;--fg:#f4f4f6;--fg2:#dedee2;--dim:#8d8b96;--dim2:#5d5b66;
  --blue:#3b1a7a;--violet:#5b21b6;--violet2:#a78bfa;--accent:#6d28d9;--live:#8b5cf6;--green:#3ddc97;--red:#ff4d6d;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:15px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:var(--fg)}
[hidden]{display:none!important}
.app{height:100%;display:flex;flex-direction:column;gap:9px;padding:calc(var(--st) + 8px) max(14px,var(--sr)) calc(var(--sb) + 4px) max(14px,var(--sl))}

/* en-tête */
.hdr{display:flex;align-items:center;gap:8px}
.brand{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.logo{display:flex;align-items:center;gap:8px}
.logo img{width:30px;height:30px;border-radius:8px}
.logo b{font-size:21px;font-weight:700}.logo span{font-size:21px;color:var(--dim)}
.logo i{width:6px;height:6px;border-radius:50%;background:var(--live);display:inline-block;margin-left:2px;align-self:flex-end;margin-bottom:6px}
.plchip{align-self:flex-start;display:flex;align-items:center;gap:6px;background:var(--panel);border-radius:99px;padding:3px 10px;font-size:11px;font-weight:600;color:var(--dim);max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.plchip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green);flex:none}
.acts{display:flex;gap:4px;padding:5px;background:var(--panel);border:1px solid var(--line);border-radius:99px;flex:none}
.ib{width:38px;height:38px;border-radius:50%;background:var(--card2);display:grid;place-items:center;flex:none}
.ib svg{width:17px;height:17px;fill:currentColor}
.ib.p,.ib.on{background:var(--violet);color:#fff}
.ib.big{width:42px;height:42px}.ib.big svg{width:20px;height:20px}
.ib:active{filter:brightness(1.3)}
.avatar{font-weight:700;font-size:15px}

/* lecteur */
.vcard{border-radius:22px;overflow:hidden;background:#000;border:1px solid var(--line);flex:none}
.vbox{position:relative;aspect-ratio:16/9;background:#000;max-height:27vh;width:100%}
.vbox video{position:absolute;inset:0;width:100%;height:100%;background:#000}
.vstate{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;text-align:center;padding:16px;font-weight:600;font-size:13px}
.vstate .pill{pointer-events:auto;margin-top:10px;height:34px}
.diag{font:12px/1.45 ui-monospace,Menlo,monospace;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;white-space:pre-wrap;word-break:break-all;color:var(--fg2)}
.diag b{color:var(--violet2)}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.info{padding:8px 14px 10px;display:flex;flex-direction:column;gap:4px}
.irow{display:flex;align-items:center;gap:8px;min-width:0}
.tag{display:flex;align-items:center;gap:5px;background:var(--chip);border-radius:99px;padding:4px 9px;font-size:10px;font-weight:700;flex:none}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--live)}
.cname{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptitle{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptitle.dim{color:var(--dim)}
.prog{display:flex;align-items:center;gap:10px;font-size:10px;font-weight:600;color:var(--dim)}
.bar{flex:1;height:3px;border-radius:2px;background:#3a3942;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--live))}
.next{font-size:11px;color:var(--violet2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrl{display:flex;align-items:center;gap:6px;padding:5px 7px;background:var(--panel);border:1px solid var(--line);border-radius:30px;flex:none}
.ctrl .sp{flex:1}
.pill{height:38px;padding:0 15px;border-radius:99px;background:var(--card2);font-size:14px;font-weight:600;white-space:nowrap;flex:none}
.pill.p,.pill.on{background:var(--violet);color:#fff}
.ph{height:132px;border-radius:22px;border:1px solid var(--line);flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;text-align:center;padding:0 14px;
  background:radial-gradient(ellipse at center,#1b1233 0%,#110c1e 45%,#000 100%)}
.ph .ib{width:50px;height:50px}
.ph b{font-size:16px}.ph small{font-size:11px;color:var(--dim)}

/* navigation, recherche */
.nav{display:flex;padding:5px;background:var(--panel);border:1px solid var(--line);border-radius:99px;flex:none}
.nav button{flex:1;height:38px;border-radius:99px;font-weight:600;color:var(--dim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.nav button.on{background:var(--chip);color:#fff}
.nav button.on::after{content:"";width:4px;height:4px;border-radius:50%;background:var(--live)}
.field{display:flex;align-items:center;gap:10px;height:44px;padding:0 16px;background:var(--entry);border-radius:99px;flex:none;border:1px solid transparent}
.field:focus-within{border-color:var(--violet)}
.field svg{width:16px;height:16px;fill:var(--dim);flex:none}
.field input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:16px}
.field input::placeholder{color:var(--dim2)}
.field .clr{color:var(--dim2);font-size:18px;line-height:1}

/* liste */
.lp{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:26px;overflow:hidden}
.lh{display:flex;align-items:center;gap:6px;padding:10px 12px 6px;font-size:11px;font-weight:600;color:var(--dim)}
.lh .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.03em}
.lh .c{color:var(--dim2)}
.back{width:30px;height:30px;border-radius:50%;background:var(--card2);display:grid;place-items:center;color:var(--fg)}
.back svg{width:14px;height:14px;fill:currentColor}
.list{flex:1;overflow-y:auto;position:relative;-webkit-overflow-scrolling:touch;padding:0 6px}
.list .sizer{position:relative;width:100%}
.row{position:absolute;left:0;right:0;display:flex;align-items:center;gap:12px;padding:0 12px;border-radius:16px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.row.cat{height:46px}.row.it{height:56px}
.row:active{background:var(--hover)}
.row.sel{background:var(--selrow);color:var(--seltext)}
.row .n{min-width:22px;font-size:11px;font-weight:600;color:var(--dim);text-align:center}
.row .tx{flex:1;min-width:0}
.row .nm{font-size:15px;font-weight:600;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sb{font-size:11px;font-weight:600;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row.sel .nm{color:var(--seltext)}.row.sel .sb{color:var(--violet)}.row.sel .n{color:#8a8698}
.row .chev{color:var(--dim2);font-size:18px}
.row .dot{width:8px;height:8px;border-radius:50%;background:var(--live);flex:none}
.row .fav{color:var(--violet2);font-size:11px}.row.sel .fav{color:var(--violet)}
.tile{width:58px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;overflow:hidden;font-size:14px;font-weight:600;color:#fff;position:relative}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:4px;background:var(--tile)}
.tile.sq{width:38px;height:38px}
.tile.icon{background:var(--chip);color:var(--violet2);font-size:16px}
.empty{padding:40px 20px;text-align:center;color:var(--dim2);font-size:14px}
.status{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--dim2);padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none;min-height:14px}
.status .spin{width:11px;height:11px;border-width:2px;flex:none}

/* fenêtres (bas de l'écran) */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fd .15s}
@keyframes fd{from{opacity:0}}
.sheet{background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;width:100%;max-width:640px;max-height:92%;display:flex;flex-direction:column;
  padding:6px max(20px,var(--sr)) calc(var(--sb) + 14px) max(20px,var(--sl));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 6px;flex:none}
.sh{display:flex;align-items:center;gap:8px;padding:8px 0 6px;flex:none}
.sh h2{flex:1;margin:0;font-size:21px;font-weight:600}
.sb2{overflow-y:auto;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.cap{font-size:11px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 6px}
.hint{font-size:13px;color:var(--dim);margin:0 0 6px}
.opt{display:flex;align-items:center;gap:14px;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:18px;width:100%;text-align:left;margin-top:10px}
.opt .ic{width:44px;height:44px;border-radius:50%;background:var(--chip);display:grid;place-items:center;color:var(--violet2);font-size:18px;flex:none}
.opt b{display:block;font-size:16px}.opt small{display:block;font-size:13px;color:var(--dim);margin-top:2px}
.btns{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;flex-wrap:wrap}
.radio,.sw{display:flex;align-items:center;gap:12px;padding:10px 0;width:100%;text-align:left;font-size:15px}
.radio i{width:20px;height:20px;border-radius:50%;border:2px solid var(--dim2);flex:none;display:grid;place-items:center}
.radio.on i{border-color:var(--violet)}.radio.on i::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--violet)}
.sw span{flex:1}
.sw i{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:var(--dim);transition:transform .15s,background .15s}
.sw.on i{background:var(--violet)}.sw.on i::after{transform:translateX(18px);background:#fff}
.plrow{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;width:100%;text-align:left}
.plrow:active{background:var(--hover)}
.plrow .tx{flex:1;min-width:0}.plrow b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.plrow small{font-size:11px;font-weight:600;color:var(--dim)}
.plrow.cur b{color:var(--violet2)}
.mini{height:30px;padding:0 11px;border-radius:99px;background:var(--card2);font-size:12px;font-weight:600}
.mini.del{color:var(--red)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:6px}
.ep{padding:12px;border-radius:16px;background:var(--panel);border:1px solid var(--line);margin-bottom:8px}
.ep.live{background:var(--card2)}
.ep .tm{font-size:12px;font-weight:600;color:var(--dim);display:flex;gap:8px;align-items:center}
.ep.live .tm{color:var(--violet2)}
.ep .tm em{font-style:normal;font-size:9px;font-weight:700;color:#fff;background:var(--violet);padding:3px 7px;border-radius:99px}
.ep b{display:block;font-size:15px;margin-top:4px}.ep p{margin:4px 0 0;font-size:13px;color:var(--dim)}
.menu{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.menu button{padding:14px;border-radius:14px;background:var(--panel);text-align:left;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(var(--sb) + 70px);transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:10px 16px;font-size:13px;font-weight:600;z-index:60;max-width:90%;text-align:center;animation:fd .2s}

/* match */
.mtop{display:flex;align-items:center;gap:8px}
.mtop .lbl{flex:1;font-size:12px;font-weight:700;color:var(--violet2)}
.score{display:flex;align-items:flex-start;background:var(--card2);border-radius:16px;padding:14px 10px;margin-top:10px;min-height:128px}
.score .tm{width:92px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;font-size:13px;font-weight:600}
.score .mid{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.score .sc{font-size:28px;font-weight:700}
.score .st{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:5px 11px;border-radius:99px;background:var(--line)}
.score .st.in{background:var(--violet)}.score .st.in::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--red)}
.score .lg{font-size:11px;font-weight:600;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.score.none{align-items:center;justify-content:center;color:var(--dim);font-size:14px;text-align:center}
.tvrow{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:11px;font-weight:600;color:var(--dim)}
.tvrow span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tvrow .pill{height:32px;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;padding:4px;background:var(--entry);border-radius:99px;margin-bottom:8px}
.seg button{flex:1;height:32px;border-radius:99px;font-size:13px;font-weight:600;color:var(--dim)}
.seg button.on{background:var(--chip);color:#fff}
.stat{margin:0 4px 14px}
.stat .l{display:flex;font-size:14px;font-weight:600;align-items:baseline}
.stat .l span{flex:1;text-align:center;font-size:13px;font-weight:400;color:var(--dim)}
.stat .l .lo{color:var(--dim)}
.sbars{display:flex;gap:6px;margin-top:6px;height:5px}
.sbars div{flex:1;background:var(--line);border-radius:3px;display:flex;overflow:hidden}
.sbars div:first-child{justify-content:flex-end}
.sbars i{display:block;height:100%;border-radius:3px}
.pos{height:8px;border-radius:4px;background:var(--violet);margin-top:6px;overflow:hidden}.pos i{display:block;height:100%;background:var(--blue)}
.ev{display:flex;gap:10px;align-items:flex-start;margin:0 4px 12px}
.ev .mn{min-width:40px;height:24px;padding:0 8px;border-radius:99px;background:var(--card2);font-size:11px;font-weight:600;display:grid;place-items:center;flex:none}
.ev .ic{width:18px;height:24px;display:grid;place-items:center;flex:none}
.ev b{display:block;font-size:14px}.ev b.goal{color:var(--violet2)}.ev p{margin:3px 0 0;font-size:13px;color:var(--dim)}
.card{display:block;width:10px;height:15px;border-radius:2px}
.pl{display:flex;align-items:center;gap:10px;height:46px;padding:0 10px;border-radius:10px;background:var(--panel);margin-bottom:4px}
.pl.st{background:var(--card2)}
.pl .j{width:26px;height:26px;border-radius:50%;background:var(--entry);font-size:11px;font-weight:600;display:grid;place-items:center;flex:none}
.pl .tx{flex:1;min-width:0}.pl b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pl small{display:block;font-size:11px;font-weight:600;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .r{width:40px;height:24px;border-radius:8px;font-size:13px;font-weight:700;color:#0b0a1a;display:grid;place-items:center;flex:none}
.team{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;margin:12px 0 8px}
.mrow{display:flex;align-items:center;gap:12px;height:58px;padding:0 12px;border-radius:16px;width:100%;text-align:left}
.mrow.sel{background:var(--selrow);color:var(--seltext)}
.mrow .tx{flex:1;min-width:0}.mrow b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow small{display:block;font-size:11px;font-weight:600;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.mrow small.tv{color:var(--violet2)}.mrow.sel small.tv{color:var(--violet)}
.foot{font-size:11px;font-weight:600;color:var(--dim2);padding-top:8px;white-space:pre-line;flex:none}

/* paysage pendant la lecture = plein écran, comme sur PC */
@media (orientation:landscape){
  body.playing .app{padding:0;gap:0}
  body.playing .hdr,body.playing .nav,body.playing .fieldwrap,body.playing .status,body.playing .ctrl,body.playing .ph{display:none!important}
  body.playing .vcard{position:fixed;inset:0;border:0;border-radius:0;z-index:20}
  body.playing .vbox{max-height:none;height:100%;aspect-ratio:auto}
  body.playing .vcard .info{display:none}
  body.playing .lp{position:fixed;top:0;bottom:0;right:0;width:min(380px,55vw);z-index:30;border-radius:0;border-width:0 0 0 1px;
    padding:calc(var(--st) + 8px) var(--sr) var(--sb) 0;transform:translateX(105%);transition:transform .2s}
  body.playing.side .lp{transform:none}
  body.playing .ov{display:flex}
}
.ov{display:none;position:fixed;inset:0;z-index:25;flex-direction:column;justify-content:space-between;padding:calc(var(--st) + 14px) max(18px,var(--sr)) calc(var(--sb) + 14px) max(18px,var(--sl));
  background:linear-gradient(180deg,rgba(0,0,0,.55),transparent 25%,transparent 55%,rgba(0,0,0,.7));transition:opacity .2s}
.ov.off{opacity:0}
.ov .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ov .bar2{background:rgba(20,19,23,.94);border:1px solid var(--line);border-radius:24px;padding:14px;display:flex;flex-direction:column;gap:10px;max-width:760px;width:100%;margin:0 auto}
.ov .bar2 .row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ov .seek{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:600;color:var(--dim)}
.ov .seek input{flex:1;accent-color:var(--live)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="hdr">
    <div class="brand">
      <div class="logo"><img src="icon-180.png" alt=""><b>Brutus</b><span>IPTV</span><i></i></div>
      <div class="plchip" id="plchip" hidden></div>
    </div>
    <div class="acts">
      <button class="ib p avatar" id="avatar" aria-label="Mes playlists">B</button>
      <button class="ib" id="btnAdd" aria-label="Ajouter une playlist"><svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg></button>
      <button class="ib" id="btnSet" aria-label="Paramètres"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3h-4l-.4 2.7a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.6 7.6 0 0 0 1.7 1L11 21h4l.4-2.7a7.6 7.6 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg></button>
    </div>
  </header>

  <div class="ph" id="ph">
    <div class="ib p"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
    <b>Choisis une chaîne</b>
    <small>Touche une chaîne : lecture · appui long : favori et guide TV · tourne le téléphone : plein écran</small>

<script>
(function () {
'use strict';

// ============================================================ utilitaires
var $ = function (id) { return document.getElementById(id); };
var APP = 'BrutusIPTV';
var EPG_HOURS = 24, EPG_DESC_MAX = 300;
var ICON = {
  play: '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
  pause: '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>',
  star: '<svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>',
  starOn: '<svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>',
  close: '<svg viewBox="0 0 24 24"><path d="m6.4 5 5.6 5.6L17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6l5.6-5.6L5 6.4z"/></svg>'
};
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function toInt(v, d) { var n = parseInt(v, 10); return isNaN(n) ? (d || 0) : n; }
function now() { return Date.now() / 1000; }
function hm(ts) { var d = new Date(ts * 1000); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
function b64(s) {
  if (!s) return '';
  try { return decodeURIComponent(escape(atob(s))); } catch (e) { return s; }
}
function lsGet(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { toast('Stockage plein : réglage non enregistré'); } }

var toastTimer = null;
function toast(t) {
  var el = document.querySelector('.toast');
  if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = t;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.remove(); }, 3200);
}
function setStatus(t, busy) {
  $('status').innerHTML = (busy ? '<span class="spin"></span>' : '') + '<span>' + esc(t) + '</span>';
}

// Petite base IndexedDB pour les fichiers M3U importés (trop gros pour localStorage)
var idb = {
  db: null,
  open: function () {
    if (this.db) return Promise.resolve(this.db);
    var self = this;
    return new Promise(function (ok, ko) {
      var r = indexedDB.open('brutus', 1);
      r.onupgradeneeded = function () { r.result.createObjectStore('files'); };
      r.onsuccess = function () { self.db = r.result; ok(r.result); };
      r.onerror = function () { ko(r.error); };
    });
  },
  put: function (k, v) { return this.open().then(function (db) { return new Promise(function (ok, ko) { var t = db.transaction('files', 'readwrite'); t.objectStore('files').put(v, k); t.oncomplete = ok; t.onerror = function () { ko(t.error); }; }); }); },
  get: function (k) { return this.open().then(function (db) { return new Promise(function (ok, ko) { var r = db.transaction('files').objectStore('files').get(k); r.onsuccess = function () { ok(r.result); }; r.onerror = function () { ko(r.error); }; }); }); },
  del: function (k) { return this.open().then(function (db) { return new Promise(function (ok) { var t = db.transaction('files', 'readwrite'); t.objectStore('files').delete(k); t.oncomplete = ok; t.onerror = ok; }); }); }
};

// ============================================================ réglages
var cfg = lsGet('brutus.cfg', {});
cfg.favs = cfg.favs || [];
cfg.playlists = cfg.playlists || [];
if (cfg.fmt == null) cfg.fmt = 'm3u8';        // l'iPhone lit le HLS (.m3u8), pas le .ts brut
if (cfg.logos == null) cfg.logos = true;
if (cfg.autoq == null) cfg.autoq = true;
if (cfg.relay == null) cfg.relay = '';
if (cfg.relayVideo == null) cfg.relayVideo = false;
function saveCfg() { lsSet('brutus.cfg', cfg); }

function sameSource(a, b) {
  if (!a || !b || a.type !== b.type) return false;
  if (a.type === 'xtream') return a.server === b.server && a.user === b.user;
  return a.src === b.src;
}

// ============================================================ réseau
function relayed(url) { return cfg.relay ? cfg.relay + encodeURIComponent(url) : url; }
function netErr(e) {
  if (e && e.name === 'AbortError') return new Error('le serveur ne répond pas (délai dépassé)');
  if (e instanceof TypeError) return new Error('connexion refusée. Le serveur bloque peut-être les pages web : active le relais dans ⚙ Paramètres');
  return e;
}
function http(url, json, timeout, direct) {
  var ctl = new AbortController();
  var t = setTimeout(function () { ctl.abort(); }, timeout || 25000);
  return fetch(direct ? url : relayed(url), { signal: ctl.signal, cache: 'no-store' }).then(function (r) {
    if (!r.ok) throw new Error('le serveur a répondu ' + r.status);
    return json ? r.json() : r.text();
  }).catch(function (e) { throw netErr(e); }).finally(function () { clearTimeout(t); });
}
function fetchText(url) {
  if (/\.gz(\?|$)/i.test(url)) {
    if (typeof DecompressionStream === 'undefined') return Promise.reject(new Error('guide .gz non pris en charge (iOS 16.4 minimum)'));
    return fetch(relayed(url)).then(function (r) {
      if (!r.ok) throw new Error('le serveur a répondu ' + r.status);
      return new Response(r.body.pipeThrough(new DecompressionStream('gzip'))).text();
    }).catch(function (e) { throw netErr(e); });
  }
  return http(url, false, 90000);
}

// ============================================================ M3U
var ATTR = /([\w-]+)="([^"]*)"/g;
function attrs(line) { var o = {}, m; ATTR.lastIndex = 0; while ((m = ATTR.exec(line))) o[m[1]] = m[2]; return o; }
function parseM3U(txt) {
  var items = [], name = null, group = null, tid = '', logo = '', epg = '';
  var lines = txt.split(/\r?\n/);
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line) continue;
    if (line.indexOf('#EXTM3U') === 0) {
      var a0 = attrs(line);
      epg = ((a0['url-tvg'] || a0['x-tvg-url'] || '').split(',')[0] || '').trim();
    } else if (line.indexOf('#EXTINF') === 0) {
      var a = attrs(line), rest = line.replace(ATTR, ''), c = rest.indexOf(',');
      name = c >= 0 ? rest.slice(c + 1).trim() : '';
      name = name || a['tvg-name'] || 'Sans nom';
      if (a['group-title']) group = a['group-title'];
      tid = (a['tvg-id'] || '').trim().toLowerCase();
      logo = (a['tvg-logo'] || '').trim();
    } else if (line.indexOf('#EXTGRP:') === 0) {
      group = line.slice(8).trim();
    } else if (line[0] === '#') {
      continue;
    } else {
      var nm = name || line;
      items.push({ name: nm, ln: nm.toLowerCase(), kind: 'play', url: line, key: tid || nm.toLowerCase(), sid: null, logo: logo || null, cat: group || 'Sans catégorie' });
      name = null; group = null; tid = ''; logo = '';
    }
  }
  return { items: items, epg: epg };
}

// ============================================================ guide TV XMLTV
function xmlDecode(s) {
  return String(s).replace(/<!\[CDATA\[([\s\S]*?)\]\]>/g, '$1').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
    .replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&#(\d+);/g, function (_, n) { return String.fromCharCode(n); })
    .replace(/&amp;/g, '&').trim();
}
function xmltvTs(s) {
  var m = /^(\d{4})(\d\d)(\d\d)(\d\d)(\d\d)(\d\d)\s*([+-]\d{4})?/.exec(s || '');
  if (!m) return 0;
  if (m[7]) {
    var t = Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +m[6]) / 1000;
    var sg = m[7][0] === '-' ? -1 : 1;
    return t - sg * (toInt(m[7].slice(1, 3)) * 3600 + toInt(m[7].slice(3, 5)) * 60);
  }
  return new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +m[6]).getTime() / 1000;
}
function parseXmltv(txt, wantedIds, wantedNames) {
  var keymap = {}, epg = {}, m, lo = now() - 3 * 3600, hi = now() + EPG_HOURS * 3600;
  var reCh = /<channel\s+id="([^"]*)"[^>]*>([\s\S]*?)<\/channel>/g, reDn = /<display-name[^>]*>([\s\S]*?)<\/display-name>/g;
  while ((m = reCh.exec(txt))) {
    var cid = m[1].trim().toLowerCase(), keys = wantedIds[cid] ? [cid] : [], d;
    reDn.lastIndex = 0;
    while ((d = reDn.exec(m[2]))) { var n = xmlDecode(d[1]).toLowerCase(); if (wantedNames[n] && keys.indexOf(n) < 0) keys.push(n); }
    if (keys.length) keymap[cid] = keys;
  }
  var reP = /<programme\s([^>]*)>([\s\S]*?)<\/programme>/g;
  while ((m = reP.exec(txt))) {
    var at = attrs(m[1]);
    var ch = (at.channel || '').trim().toLowerCase();
    var ks = keymap[ch] || (wantedIds[ch] ? [ch] : null);
    if (!ks) continue;
    var st = xmltvTs(at.start), en = xmltvTs(at.stop);
    if (en < lo || st > hi) continue;
    var t = /<title[^>]*>([\s\S]*?)<\/title>/.exec(m[2]), ds = /<desc[^>]*>([\s\S]*?)<\/desc>/.exec(m[2]);
    var p = [st, en, t ? xmlDecode(t[1]) : '', ds ? xmlDecode(ds[1]).slice(0, EPG_DESC_MAX) : ''];
    ks.forEach(function (k) { (epg[k] = epg[k] || []).push(p); });
  }
  Object.keys(epg).forEach(function (k) { epg[k].sort(function (x, y) { return x[0] - y[0]; }); });
  return epg;
}

// ============================================================ tri FR, initiales, qualité
var FR_RE = /^[\W_]*(FR(?![A-Za-z])|FRAN[CÇ]|FRENCH)/i;
function frFirst(arr, key) {
  var fr = [], other = [];
  arr.forEach(function (x) { (FR_RE.test(key(x)) ? fr : other).push(x); });
  return fr.concat(other);
}
var PREFIX_RE = /^[\W_]*(?:FR|UK|US|DE|ES|IT|BE|CH|CA|AR|PT|NL|VIP|4K|HD)[\W_]+/i;
function initials(text) {
  var w = (String(text || '').replace(PREFIX_RE, '').match(/[A-Za-z0-9À-ÿ]+/g)) || (String(text || '').match(/[A-Za-z0-9À-ÿ]+/g)) || [];
  if (!w.length) return '•';
  return (w[0][0] + (w.length > 1 ? w[1][0] : (w[0][1] || ''))).toUpperCase();
}
var TILE_COLORS = ['#2a2531', '#2d2440', '#262230', '#33284a', '#2a2838', '#2e2a3a'];
function tileColor(t) { var s = 0; for (var i = 0; i < (t || '').length; i++) s += t.charCodeAt(i); return TILE_COLORS[s % TILE_COLORS.length]; }

var W = '(?<![a-z0-9])', E = '(?![a-z0-9])';
var QUAL = [[4, new RegExp(W + '(4k|uhd|2160p?)' + E + '|ᵁᴴᴰ|ᵘʰᵈ', 'i')], [3, new RegExp(W + '(fhd|1080[pi]?|full ?hd)' + E + '|ᶠᴴᴰ', 'i')],
  [2, new RegExp(W + '(hd|720p?)' + E + '|ᴴᴰ', 'i')], [1, new RegExp(W + '(sd|lq|480p?|576[pi]?|low)' + E + '|ˢᴰ', 'i')]];
var JUNK = new RegExp(W + '(4k|uhd|2160p?|fhd|1080[pi]?|full ?hd|hd|720p?|sd|lq|hq|480p?|576[pi]?|low|hevc|h\\.?26[45]|x26[45]|\\d{2,3} ?fps|backup|bkp|raw)' + E, 'gi');
var SUPER = /[ʰ-˿ᴀ-ᶿ⁰-₟]+/g;
function qualityOf(n) { for (var i = 0; i < QUAL.length; i++) if (QUAL[i][1].test(n || '')) return QUAL[i][0]; return 2; }
function baseName(n) { return String(n || '').toLowerCase().replace(SUPER, ' ').replace(JUNK, ' ').replace(/[\W_]+/g, ' ').trim().replace(/\s+/g, ' '); }
function siblings(ctx, name, url) {
  var b = baseName(name), out = [];
  (ctx || []).forEach(function (it) { if (it.kind === 'play' && it.url !== url && baseName(it.name) === b) out.push([qualityOf(it.name), it]); });
  return out;
}

// ============================================================ état
var S = {
  source: null, pl: null, xt: null, m3u: [], epg: null, epgLoading: false,
  mode: 'live', nav: [['live', 'TV']], cats: [], catView: [], current: [], rows: [],
  listMode: 'cats', prevMode: 'cats', itemsTitle: 'CHAÎNES', catId: null, seriesBack: null,
  pools: {}, poolLoading: {}, playing: null, playProgs: [], aq: null, sportCache: null
};

// ============================================================ Xtream
function xtApi(params, timeout) {
  var q = 'username=' + encodeURIComponent(S.xt.user) + '&password=' + encodeURIComponent(S.xt.pwd);
  Object.keys(params || {}).forEach(function (k) { q += '&' + k + '=' + encodeURIComponent(params[k]); });
  return http(S.xt.server + '/player_api.php?' + q, true, timeout || 30000);
}
function xtBase(kind) { return S.xt.server + '/' + kind + '/' + encodeURIComponent(S.xt.user) + '/' + encodeURIComponent(S.xt.pwd) + '/'; }
function playUrl(url) {
  var u = liveUrl(url);
  return (cfg.relay && cfg.relayVideo) ? cfg.relay + encodeURIComponent(u) : u;
}
function liveUrl(url) {
  if (S.xt && url.indexOf(xtBase('live')) === 0) return url.replace(/\.(ts|m3u8)$/, '.' + cfg.fmt);
  return url;
}
function xtItems(data, mode) {
  var out = [];
  (Array.isArray(data) ? data : []).forEach(function (d) {
    var nm = d.name || '?';
    if (mode === 'live') out.push({ name: nm, ln: nm.toLowerCase(), kind: 'play', url: xtBase('live') + d.stream_id + '.ts', sid: d.stream_id, key: null, logo: d.stream_icon || null, cat: String(d.category_id) });
    else if (mode === 'vod') out.push({ name: nm, ln: nm.toLowerCase(), kind: 'play', url: xtBase('movie') + d.stream_id + '.' + (d.container_extension || 'mp4'), sid: null, key: null, logo: d.stream_icon || null, cat: String(d.category_id) });
    else out.push({ name: nm, ln: nm.toLowerCase(), kind: 'series', url: '', series: d.series_id, logo: d.cover || null, cat: String(d.category_id) });
  });
  return out;
}

// ============================================================ playlists
function setPlName(name) {
  S.pl = S.pl || {};
  S.pl.name = name || '';
  $('plchip').textContent = S.pl.name;
  $('plchip').hidden = !S.pl.name;
  $('avatar').textContent = ((S.pl.name || 'B').match(/[A-Za-z0-9]/) || ['B'])[0].toUpperCase();
  cfg.last = S.pl; saveCfg();
}
function savedName(p) { var f = cfg.playlists.filter(function (x) { return sameSource(x, p); })[0]; return f ? f.name : ''; }
function upsertPlaylist(name) {
  var p = Object.assign({}, S.pl, { name: name });
  cfg.playlists = cfg.playlists.filter(function (x) { return !sameSource(x, p) && x.name !== name; });
  cfg.playlists.push(p);
  setPlName(name);
}
function suggestedName() {
  var p = S.pl;
  if (!p) return '';
  if (p.name) return p.name;
  if (p.type === 'xtream') { try { return new URL(p.server).hostname; } catch (e) { return 'Xtream'; } }
  var s = (p.src || '').replace(/^file:/, '');
  return s.split('/').pop().split('?')[0].replace(/\.[^.]+$/, '') || 'Ma liste';
}

function openPlaylist(p, save) {
  S.epg = null; S.pools = {}; S.poolLoading = {}; S.sportCache = null;
  if (p.type === 'xtream') return xtreamLogin(p, save);
  loadM3U(p, save);
}

function xtreamLogin(p, save) {
  var server = String(p.server || '').trim().replace(/\/(player_api|get|xmltv)\.php.*$/i, '').replace(/\/+$/, '');
  if (!/^https?:\/\//i.test(server)) server = 'https://' + server;
  S.xt = { server: server, user: String(p.user || '').trim(), pwd: p.pwd || '' };
  setStatus('Connexion au serveur Xtream…', true);
  renderEmpty('Connexion…');
  xtApi({}).then(function (info) {
    var ui = (info && info.user_info) || {};
    if (String(ui.auth) !== '1') throw new Error('identifiants refusés par le serveur');
    S.source = 'xtream'; S.m3u = [];
    S.pl = { type: 'xtream', server: server, user: S.xt.user, pwd: S.xt.pwd };
    var name = p.name || savedName(S.pl);
    if (save && name) upsertPlaylist(name); else setPlName(name);
    var exp = toInt(ui.exp_date);
    S.connInfo = 'Connecté' + (exp ? ' · expire le ' + new Date(exp * 1000).toLocaleDateString('fr-FR') : '');
    S.nav = [['live', 'TV'], ['vod', 'Films'], ['series', 'Séries']];
    setMode('live');
  }).catch(function (e) {
    setStatus('Erreur : ' + e.message);
    renderEmpty('Connexion impossible : ' + esc(e.message));
  });
}

function loadM3U(p, save) {
  setStatus('Chargement de la liste M3U…', true);
  renderEmpty('Chargement…');
  var src = p.src || '';
  var get = src.indexOf('file:') === 0
    ? idb.get(src).then(function (t) { if (t == null) throw new Error('fichier introuvable, réimporte-le'); return t; })
    : http(src, false, 90000);
  get.then(function (txt) {
    var r = parseM3U(txt);
    S.source = 'm3u'; S.xt = null; S.m3u = r.items;
    S.pl = { type: 'm3u', src: src, epg: p.epg || '' };
    var name = p.name || savedName(S.pl);
    if (save && name) upsertPlaylist(name); else setPlName(name);
    var groups = [], seen = {};
    r.items.forEach(function (x) { if (!seen[x.cat]) { seen[x.cat] = 1; groups.push(x.cat); } });
    groups = frFirst(groups, function (g) { return g; });
    S.cats = [{ id: '__fav', name: '★  Favoris' }, { id: '__all', name: 'Toutes les chaînes  ·  ' + r.items.length }]
      .concat(groups.map(function (g) { return { id: g, name: g }; }));
    S.nav = [['live', 'TV']]; S.mode = 'live'; renderNav();
    S.current = [];
    showList('cats');
    setStatus(r.items.length + ' chaînes chargées · ' + groups.length + ' catégories');
    loadM3uEpg(p.epg || r.epg);
  }).catch(function (e) {
    setStatus('Erreur : ' + e.message);
    renderEmpty('Liste M3U illisible : ' + esc(e.message));
  });
}

function loadM3uEpg(url) {
  if (!url || !/^https?:/i.test(url)) return;
  var ids = {}, names = {};

function searchPool() {
  if (S.source === 'm3u') return S.m3u;

function renderSearch(q) {
  var rank = {}, names = {};
  S.cats.forEach(function (c, i) { rank[c.id] = i; names[c.id] = c.name; });
  var catRows = S.cats.filter(function (c) { return c.name.toLowerCase().indexOf(q) >= 0; })
    .map(function (c) { return { name: c.name, kind: 'category', cat: c.id, sub: 'Catégorie' }; });

  var res = (pool || []).filter(function (it) { return it.ln.indexOf(q) >= 0; });

// toucher / appui long sur une ligne
(function () {
  var list = $('list'), timer = null, startY = 0, startX = 0, longFired = false, target = null;
  list.addEventListener('scroll', function () { drawList(false); clearTimeout(timer); }, { passive: true });
  list.addEventListener('touchstart', function (e) {
    target = e.target.closest('.row'); longFired = false;
    if (!target) return;
    startY = e.touches[0].clientY; startX = e.touches[0].clientX;
    var i = +target.dataset.i;
    timer = setTimeout(function () { longFired = true; rowMenu(V.items[i]); }, 520);
  }, { passive: true });
  list.addEventListener('touchmove', function (e) {
    if (Math.abs(e.touches[0].clientY - startY) > 8 || Math.abs(e.touches[0].clientX - startX) > 8) clearTimeout(timer);
  }, { passive: true });
  list.addEventListener('touchend', function () { clearTimeout(timer); }, { passive: true });
  list.addEventListener('contextmenu', function (e) {
    var r = e.target.closest('.row'); if (!r) return;
    e.preventDefault(); if (!longFired) rowMenu(V.items[+r.dataset.i]);
  });
  list.addEventListener('click', function (e) {
    var r = e.target.closest('.row');
    if (!r || longFired) { longFired = false; return; }
    tap(V.items[+r.dataset.i]);
  });
})();

function isPlaying(it) { return it && it.kind === 'play' && S.playing && S.playing.url === it.url; }
function isFav(it) { return !!it && cfg.favs.some(function (f) { return f.url === it.url; }); }

function play(it, ctx, auto) {

  else S.aq = { ctx: (ctx || []).filter(function (x) { return x.kind === 'play'; }), name: it.name, url: it.url, level: qualityOf(it.name), origin: qualityOf(it.name), lastChange: 0, reduced: false, token: (S.aq ? S.aq.token : 0) + 1 };

// ============================================================ diagnostic de lecture
function mask(u) {

function diagnose() {

  }

    };

  lines.push('<b>Chaîne</b> ' + esc(it.name));
  lines.push('<b>Adresse</b> ' + esc(mask(url)));
  lines.push('<b>Page</b> ' + esc(location.protocol) + ' · <b>Format</b> ' + cfg.fmt + ' · <b>Relais</b> ' + (cfg.relay ? (cfg.relayVideo ? 'API + vidéo' : 'API seulement') : 'aucun'));
  lines.push('<b>Erreur du lecteur</b> ' + esc(S.lastErr || 'aucune') + (video.error ? ' (code ' + video.error.code + (video.error.message ? ' : ' + esc(video.error.message) : '') + ')' : ''));
  lines.push('<b>HLS natif</b> ' + (video.canPlayType('application/vnd.apple.mpegurl') || 'non') + ' · <b>MSE</b> ' + (window.ManagedMediaSource ? 'ManagedMediaSource' : window.MediaSource ? 'MediaSource' : 'non'));
  if (/^http:/i.test(url) && location.protocol === 'https:') lines.push('<b>⚠</b> l\'adresse du flux est en http:// : l\'iPhone la bloque dans une page https.');
  lines.push('<b>Test réseau</b> en cours…');

  fetch(url, { signal: ctl.signal, cache: 'no-store' }).then(function (r) {

      return r.text().then(function (t) {
        var head5 = t.split(/\r?\n/).filter(Boolean).slice(0, 8).join('\n');
        lines.push('<b>Début du contenu</b>\n' + esc(mask(head5).slice(0, 700)));
        var seg = /^\s*#EXTM3U/.test(t) && t.split(/\r?\n/).filter(function (l) { return l && l[0] !== '#'; })[0];
        if (seg) {
          var su = new URL(seg, r.url).href;
          lines.push('<b>1er segment</b> ' + esc(mask(su)));
          if (/^http:/i.test(su) && location.protocol === 'https:') lines.push('<b>⚠</b> les segments sont en http:// : bloqués par l\'iPhone dans une page https.');
        }
      });
    }
    try { ctl.abort(); } catch (e) {}
  }).catch(function (e) {
    lines.pop();
    lines.push('<b>Test réseau</b> échec : ' + esc(e.name + ' ' + e.message));
    lines.push('→ soit le flux redirige vers http://, soit le serveur refuse les pages web. Le relais (⚙ Paramètres, avec « vidéo par le relais ») contourne les deux.');
  }).then(function () {
    if (!cfg.relay) return;
    lines.push('<b>Test via le relais</b> en cours…'); out();
    return fetch(cfg.relay + encodeURIComponent(url) + '&debug=1', { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (t) {
      lines.pop(); lines.push('<b>Chemin du flux (relais)</b>\n' + esc(mask(t).slice(0, 900)));
    }).catch(function (e) { lines.pop(); lines.push('<b>Relais</b> injoignable : ' + esc(e.message)); });
  }).finally(function () { clearTimeout(tm); out(); });
}

// ============================================================ qualité automatique
function aqOnState(st) {
  var a = S.aq;
  if (!cfg.autoq || !a || !S.playing) return;
  if (Date.now() - a.loaded < 8000) return;                 // mise en mémoire tampon normale au démarrage
  if (st === 'buffering' || st === 'error') {
    if (!a.stall) {
      a.stall = Date.now();
      var tok = a.token, url = a.url;
      setTimeout(function () {
        if (S.aq === a && a.token === tok && a.url === url && a.stall && Date.now() - a.stall >= 6000) aqDowngrade(st === 'error' ? 'flux coupé' : 'longue coupure');
      }, 6500);
    }
  } else if (st === 'playing') a.stall = null;
}
function aqDowngrade(why) {
  var a = S.aq;
  if (!a || Date.now() - a.lastChange < 15000) return;
  var lower = siblings(a.ctx, a.name, a.url).filter(function (x) { return x[0] < a.level; });
  if (!lower.length) { setStatus('Connexion instable : cette chaîne n\'existe pas en qualité inférieure'); return; }
  lower.sort(function (x, y) { return y[0] - x[0]; });
  var old = a.name;
  a.reduced = true; a.lastChange = Date.now();
  play(lower[0][1], null, true);
  toast('Qualité réduite : ' + old + ' → ' + lower[0][1].name + ' (' + why + ')');
}
setInterval(function () {
  var a = S.aq;
  if (!cfg.autoq || !a || !S.playing || !a.reduced || a.stall) return;
  if (Date.now() - a.lastChange < 600000) return;
  var higher = siblings(a.ctx, a.name, a.url).filter(function (x) { return x[0] > a.level && x[0] <= a.origin; });
  if (!higher.length) { a.reduced = false; return; }
  higher.sort(function (x, y) { return x[0] - y[0]; });
  a.lastChange = Date.now();
  play(higher[0][1], null, true);
  if (a.level >= a.origin) a.reduced = false;
  toast('Connexion stable : retour en ' + higher[0][1].name);
}, 20000);

  var posfr = { G: 'GB', D: 'DEF', M: 'MIL', F: 'ATT', A: 'ATT' }, h = '';

  ['home', 'away'].forEach(function (side) {
    var pl = d.players[side]; if (!pl.length) return;
    var best = Math.max.apply(null, pl.map(function (p) { return p.rating; }));
    h += '<div class="team">' + teamTile(m[side], 26) + esc(m[side].name) + '</div>';
    pl.forEach(function (p) {
      var st = p.stats, bits = [];
      if (st.totalGoals) bits.push(st.totalGoals + ' but' + (st.totalGoals > 1 ? 's' : ''));
      if (st.goalAssists) bits.push(st.goalAssists + ' passe déc.');
      if (st.totalShots) bits.push(st.totalShots + ' tirs (' + (st.shotsOnTarget || 0) + ' cadrés)');
      if (st.saves) bits.push(st.saves + ' arrêts');
      if (st.yellowCards) bits.push('carton jaune');
      if (st.redCards) bits.push('carton rouge');
      var info = (posfr[p.pos[0]] || p.pos) + (p.starter ? '' : ' · entré') + (bits.length ? '  ·  ' + bits.join(', ') : '');
      h += '<div class="pl' + (p.starter ? ' st' : '') + '"><span class="j">' + esc(p.jersey || '–') + '</span><span class="tx"><b>' + (p.rating === best ? '★ ' : '') + esc(p.name) +
        '</b><small>' + esc(info) + '</small></span><span class="r" style="background:' + ratingColor(p.rating) + '">' + p.rating.toFixed(1) + '</span></div>';
    });
  });
  return h;
}

// ============================================================ branchements
$('avatar').onclick = openPlaylists;

$('btnSet').onclick = openSettings;
$('back').onclick = back;
$('bPlay').onclick = togglePlay;

$('bFav').onclick = function () { toggleFav(); };
$('bMatch').onclick = openMatch;
$('bFs').onclick = fullscreen;
$('vbox').addEventListener('dblclick', fullscreen);
$('nav').onclick = function (e) { var b = e.target.closest('button'); if (b && b.dataset.k !== S.mode) setMode(b.dataset.k); };
var searchTimer = null;
$('search').addEventListener('input', function () {
  $('clr').hidden = !this.value;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(applyFilter, 220);
});
$('search').addEventListener('keydown', function (e) { if (e.key === 'Enter') this.blur(); });
$('clr').onclick = function (e) { e.preventDefault(); clearSearch(); applyFilter(); };

setVState('idle'); updateFav(); renderNav();
setStatus('Ouvre une playlist enregistrée, charge une liste M3U ou connecte-toi à un serveur Xtream.');
renderEmpty('Ajoute une playlist avec le bouton <b>+</b> en haut à droite.');
if (cfg.last && (cfg.last.server || cfg.last.src)) openPlaylist(cfg.last);

window.__brutus = { S: S, cfg: cfg, openPlaylist: openPlaylist, play: play, openMatch: openMatch };
})();
